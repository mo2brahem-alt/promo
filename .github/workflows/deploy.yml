name: Deploy Laravel to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Laravel to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP on GitHub Actions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, ctype, fileinfo, json, openssl, pdo, pdo_mysql, tokenizer, xml
          coverage: none

      - name: Install Composer dependencies
        if: hashFiles('composer.json') != ''
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node on GitHub Actions
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build frontend assets
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found. Skipping frontend build."
          fi

      - name: Prepare deployment package
        run: |
          rm -rf .git
          rm -rf .github
          rm -rf node_modules
          rm -rf tests
          rm -f .env
          rm -f .env.*
          rm -f .editorconfig
          rm -f .gitattributes
          rm -rf storage/logs/*
          rm -rf storage/framework/cache/*
          rm -rf storage/framework/sessions/*
          rm -rf storage/framework/views/*
          rm -f bootstrap/cache/*.php

      - name: Deploy files to Hostinger via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "."
          target: ${{ secrets.HOSTINGER_PATH }}
          rm: false
          overwrite: true
          strip_components: 0

      - name: Run Laravel commands on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            cd ${{ secrets.HOSTINGER_PATH }}

            PHP_BIN="/opt/alt/php82/usr/bin/php"

            echo "Using PHP:"
            $PHP_BIN -v

            if [ -f artisan ]; then
              $PHP_BIN artisan config:clear || true
              $PHP_BIN artisan cache:clear || true
              $PHP_BIN artisan route:clear || true
              $PHP_BIN artisan view:clear || true

              $PHP_BIN artisan migrate --force || true
              $PHP_BIN artisan db:seed --force || true

              $PHP_BIN artisan config:cache || true
              $PHP_BIN artisan route:cache || true
              $PHP_BIN artisan view:cache || true
            else
              echo "No Laravel artisan file found. Skipping Laravel commands."
            fi