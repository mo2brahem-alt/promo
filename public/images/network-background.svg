<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset="45%" stop-color="#2563eb" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .link {
        fill: none;
        stroke: #0891b2;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 8 18;
        opacity: .16;
        animation: linkPulse 7s ease-in-out infinite;
      }
      .link.alt {
        stroke: #7c3aed;
        animation-duration: 9s;
        animation-delay: -2s;
      }
      .link.hot {
        stroke: #f97316;
        animation-duration: 6s;
        animation-delay: -4s;
      }
      .node {
        fill: #ffffff;
        stroke: #0891b2;
        stroke-width: 2;
        opacity: .72;
        filter: url(#softGlow);
        animation: nodeBlink 5s ease-in-out infinite;
      }
      .node.alt {
        stroke: #7c3aed;
        animation-delay: -1.5s;
      }
      .hub {
        fill: #ffffff;
        stroke: #0891b2;
        stroke-width: 4;
        filter: url(#softGlow);
        animation: hubPulse 4.5s ease-in-out infinite;
      }
      .hub.alt {
        stroke: #7c3aed;
        animation-delay: -1.8s;
      }
      .hub.hot {
        stroke: #f97316;
        animation-delay: -3s;
      }
      .glow {
        fill: url(#hubGlow);
        opacity: .42;
        animation: glowBreath 6s ease-in-out infinite;
      }
      @keyframes linkPulse {
        0%, 100% {
          opacity: .08;
          stroke-dashoffset: 0;
        }
        45% {
          opacity: .42;
        }
        70% {
          opacity: .20;
        }
        100% {
          stroke-dashoffset: -72;
        }
      }
      @keyframes nodeBlink {
        0%, 100% {
          opacity: .35;
          r: 4;
        }
        42% {
          opacity: .95;
          r: 6;
        }
        68% {
          opacity: .50;
          r: 4.5;
        }
      }
      @keyframes hubPulse {
        0%, 100% {
          opacity: .70;
          r: 9;
        }
        45% {
          opacity: 1;
          r: 13;
        }
      }
      @keyframes glowBreath {
        0%, 100% {
          opacity: .18;
          transform: scale(.86);
        }
        50% {
          opacity: .46;
          transform: scale(1.12);
        }
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="transparent"/>

  <g opacity=".95">
    <circle class="glow" cx="250" cy="190" r="120"/>
    <circle class="glow" cx="760" cy="260" r="160"/>
    <circle class="glow" cx="1220" cy="210" r="130"/>
    <circle class="glow" cx="470" cy="650" r="150"/>
    <circle class="glow" cx="1030" cy="670" r="170"/>
  </g>

  <g>
    <path class="link" d="M250 190 430 115 760 260 970 145 1220 210"/>
    <path class="link alt" d="M250 190 180 420 470 650 760 260 1030 670 1220 210"/>
    <path class="link hot" d="M470 650 650 770 1030 670 1320 760 1430 520 1220 210"/>
    <path class="link" d="M760 260 620 470 470 650 315 540 180 420"/>
    <path class="link alt" d="M760 260 900 430 1030 670 1160 460 1220 210"/>
    <path class="link" d="M90 120 250 190 360 310 620 470 900 430 1160 460 1510 320"/>
    <path class="link hot" d="M210 780 470 650 620 470 760 260 1160 460 1430 520"/>
    <path class="link alt" d="M430 115 360 310 180 420 315 540 650 770"/>
    <path class="link" d="M970 145 900 430 650 770"/>
    <path class="link hot" d="M1030 670 1160 460 1510 320"/>
  </g>

  <g>
    <circle class="node" cx="90" cy="120" r="5"/>
    <circle class="node alt" cx="430" cy="115" r="5"/>
    <circle class="node" cx="970" cy="145" r="5"/>
    <circle class="node alt" cx="1510" cy="320" r="5"/>
    <circle class="node" cx="180" cy="420" r="5"/>
    <circle class="node alt" cx="360" cy="310" r="5"/>
    <circle class="node" cx="620" cy="470" r="5"/>
    <circle class="node alt" cx="900" cy="430" r="5"/>
    <circle class="node" cx="1160" cy="460" r="5"/>
    <circle class="node alt" cx="1430" cy="520" r="5"/>
    <circle class="node" cx="315" cy="540" r="5"/>
    <circle class="node alt" cx="650" cy="770" r="5"/>
    <circle class="node" cx="1320" cy="760" r="5"/>
    <circle class="node alt" cx="210" cy="780" r="5"/>
  </g>

  <g>
    <circle class="hub" cx="250" cy="190" r="10"/>
    <circle class="hub alt" cx="760" cy="260" r="10"/>
    <circle class="hub hot" cx="1220" cy="210" r="10"/>
    <circle class="hub alt" cx="470" cy="650" r="10"/>
    <circle class="hub" cx="1030" cy="670" r="10"/>
  </g>
</svg>
